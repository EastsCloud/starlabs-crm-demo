name: Tests
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ams_test
          POSTGRES_USER: ams_test
          POSTGRES_PASSWORD: local-ci-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ams_test -d ams_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ams_test:local-ci-test-password@127.0.0.1:5432/ams_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: git diff --check

{% extends "base.html" %}
{% import "_controls.html" as ui %}
{% block title %}{{ '编辑学生' if student else '新增学生' }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ '编辑学生' if student else '新增学生' }}</h1></div><button class="button ghost" type="button" data-history-back data-fallback="{{ '/students/' ~ student.id if student else '/students' }}">返回</button></div>
<section class="panel form-panel">
  <form method="post" action="{{ action }}" class="form-grid">
    <label>姓名<input name="name" required value="{{ student.name if student else '' }}"></label>
    <label>年级<input name="grade" required value="{{ student.grade if student else '' }}" placeholder="例如 11年级"></label>
    <label>目标学校<input name="target_school" value="{{ student.target_school if student else '' }}"></label>
    <label>目标方向<input name="target_major" value="{{ student.target_major if student else '' }}"></label>
    <label>优先级<select name="priority_level">{{ ui.options(schemas.PRIORITIES, student.priority_level if student else '中') }}</select></label>
    <div class="form-section-title">个人与联系信息</div>
    <label>出生日期<input type="date" name="birth_date" value="{{ student.birth_date.isoformat() if student and student.birth_date else '' }}"></label>
    <label>电话<input name="phone" value="{{ student.phone if student else '' }}"></label>
    <label class="wide">地址<textarea name="address" rows="2">{{ student.address if student else '' }}</textarea></label>
    <label class="wide">中文地址<textarea name="chinese_address" rows="2">{{ student.chinese_address if student else '' }}</textarea></label>
    <label class="wide">身份证号码<input name="national_id_number" value="{{ student.national_id_number if student else '' }}"></label>
    <div class="form-section-title">护照与申请资金</div>
    <label>护照号码<input name="passport_number" value="{{ student.passport_number if student else '' }}"></label>
    <label>护照签发日期<input type="date" name="passport_issue_date" value="{{ student.passport_issue_date.isoformat() if student and student.passport_issue_date else '' }}"></label>
    <label>护照到期日期<input type="date" name="passport_expiry_date" value="{{ student.passport_expiry_date.isoformat() if student and student.passport_expiry_date else '' }}"></label>
    <label>存款证明金额（美元）<input name="bank_certificate_amount" value="{{ student.bank_certificate_amount if student else '' }}"></label>
    <div class="form-section-title">信用卡信息</div>
    <label>信用卡卡主姓名<input name="credit_card_holder" value="{{ student.credit_card_holder if student else '' }}"></label>
    <label>持卡人电话<input name="cardholder_phone" value="{{ student.cardholder_phone if student else '' }}"></label>
    <label>通道<input name="card_channel" value="{{ student.card_channel if student else '' }}"></label>
    <label>卡号<input name="card_number" value="{{ student.card_number if student else '' }}"></label>
    <label>有效期<input name="card_expiry" value="{{ student.card_expiry if student else '' }}" placeholder="MM/YY"></label>
    <label class="wide">备注<textarea name="notes" rows="4">{{ student.notes if student else '' }}</textarea></label>
    <div class="form-actions"><button class="button primary" type="submit">保存</button></div>
  </form>
</section>
{% endblock %}
